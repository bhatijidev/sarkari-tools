<body>
  <div id="header-placeholder"></div>

  <main class="tool-page">
    <div class="tool-container">
      <div class="breadcrumb">
        <a href="/">Home</a>
        <span class="separator">/</span>
        <a href="/tools.html">Tools</a>
        <span class="separator">/</span>
        <span class="current">Fake Data Generator</span>
      </div>

      <div class="tool-hero">
        <div class="tool-icon" style="background:#f1f5f9; color:#475569;">🎲</div>
        <h1>Mock &amp; Fake Data Generator (US/UK/Global)</h1>
        <p class="tool-description">Generate realistic test data for application testing, database seeding, and QA mockups. Generates valid-format addresses, phone numbers, dummy cards, and exportable JSON/CSV files.</p>
      </div>

      <div class="tool-workspace">
        <div style="display:grid; grid-template-columns: 280px 1fr; gap: 24px;">
          <!-- Left: Settings -->
          <div class="settings-panel">
            <h3 style="font-size:16px; font-weight:700; margin-bottom:14px;">⚙️ Generation Options</h3>

            <div class="settings-group">
              <label class="form-label" for="localeSelect">Target Country Locale</label>
              <select id="localeSelect" class="form-select">
                <option value="us" selected>🇺🇸 United States</option>
                <option value="uk">🇬🇧 United Kingdom</option>
                <option value="ca">🇨🇦 Canada</option>
                <option value="au">🇦🇺 Australia</option>
              </select>
            </div>

            <div class="settings-group">
              <label class="form-label" for="recordCount">Number of Records</label>
              <select id="recordCount" class="form-select">
                <option value="5">5 Records</option>
                <option value="10" selected>10 Records</option>
                <option value="25">25 Records</option>
                <option value="50">50 Records</option>
              </select>
            </div>

            <div class="settings-group">
              <label class="form-label">Include Fields</label>
              <div style="display:flex; flex-direction:column; gap:6px; font-size:13px;">
                <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
                  <input type="checkbox" id="chkAddress" checked> Street Address &amp; ZIP
                </label>
                <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
                  <input type="checkbox" id="chkPhone" checked> Phone Number
                </label>
                <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
                  <input type="checkbox" id="chkCompany" checked> Company &amp; Job Title
                </label>
                <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
                  <input type="checkbox" id="chkCard" checked> Dummy Card (Test Only)
                </label>
              </div>
            </div>

            <button type="button" id="btnGenerate" class="btn btn-primary" style="width:100%; margin-top:14px;">⚡ Generate Data</button>
          </div>

          <!-- Right: Output View -->
          <div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
              <div style="display:flex; gap:6px;">
                <button type="button" id="tabTable" class="btn btn-sm btn-primary">Table View</button>
                <button type="button" id="tabJson" class="btn btn-sm btn-outline">JSON</button>
                <button type="button" id="tabCsv" class="btn btn-sm btn-outline">CSV</button>
              </div>
              <div style="display:flex; gap:6px;">
                <button type="button" id="btnCopyData" class="btn btn-sm btn-outline">📋 Copy</button>
                <button type="button" id="btnDownloadData" class="btn btn-sm btn-outline">💾 Download</button>
              </div>
            </div>

            <div id="tableViewWrap" style="max-height:450px; overflow:auto; border:1px solid var(--border-color, #e2e8f0); border-radius:8px;">
              <table style="width:100%; border-collapse:collapse; font-size:12px;">
                <thead style="background:#f8fafc; position:sticky; top:0;">
                  <tr id="tableHeadRow"></tr>
                </thead>
                <tbody id="tableBody"></tbody>
              </table>
            </div>

            <textarea id="codeViewArea" class="form-textarea" rows="18" style="display:none; font-family:monospace; font-size:12px;"></textarea>
          </div>
        </div>
      </div>
    </div>
